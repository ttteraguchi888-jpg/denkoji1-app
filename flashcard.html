<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAR RECALL - 第一種電気工事士 Bear Sync</title>
<style>
:root{
  --pb:#00d4ff;--db:#0044cc;--bg:#000814;
  --sf:#001233;--s2:#0a1628;
  --cy:#00ffcc;--pu:#7b2fff;
  --tx:#e0f4ff;--td:#8ab4d4;--br:#003366;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI","Meiryo",sans-serif;display:flex;flex-direction:column;min-height:100vh;}
header{background:var(--sf);padding:10px 20px;display:flex;align-items:center;border-bottom:2px solid var(--pb);box-shadow:0 0 10px rgba(0,212,255,.3);}
.bl{width:48px;height:48px;margin-right:14px;}
header h1{font-size:1.4rem;text-shadow:0 0 5px var(--pb);}
.hlink{margin-left:auto;background:transparent;color:var(--pb);border:1px solid var(--pb);padding:5px 14px;border-radius:4px;text-decoration:none;font-size:.88rem;}
.wrap{max-width:820px;margin:30px auto;padding:0 20px;flex-grow:1;display:flex;flex-direction:column;align-items:center;width:100%;}
/* 統計バー */
.stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
.stat-box{background:var(--sf);border:1px solid var(--br);border-radius:8px;padding:10px 18px;text-align:center;min-width:90px;}
.stat-n{font-size:1.6rem;font-weight:bold;color:var(--pb);}
.stat-l{font-size:.78rem;color:var(--td);}
/* フラッシュカード */
.fc{background:var(--sf);border:1px solid var(--br);border-radius:12px;width:100%;box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 15px rgba(0,212,255,.1);}
.fc-head{background:var(--s2);padding:14px 18px;border-bottom:1px solid var(--br);border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.badge{background:var(--db);color:var(--tx);padding:4px 10px;border-radius:20px;font-size:.82rem;border:1px solid var(--pb);}
.badge.red{background:rgba(255,50,50,.2);border-color:#ff5555;color:#ff9999;}
.badge.ylw{background:rgba(255,200,0,.15);border-color:#ffcc00;color:#ffdd55;}
.badge.grn{background:rgba(0,255,150,.1);border-color:#00cc88;color:#00ffaa;}
.level-bar{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--td);}
.lv-dot{width:10px;height:10px;border-radius:50%;background:var(--br);}
.lv-dot.on{background:var(--pb);}
.fc-body{padding:30px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:280px;justify-content:center;}
.q-info{font-size:1.2rem;margin-bottom:8px;font-weight:bold;}
.q-sub{font-size:.9rem;color:var(--td);margin-bottom:16px;}
.q-memo{background:var(--s2);border-left:4px solid var(--pb);padding:12px 16px;border-radius:6px;font-size:.95rem;color:var(--cy);text-align:left;margin-bottom:20px;width:100%;max-width:560px;}
.q-memo .m-lbl{font-size:.78rem;color:var(--td);margin-bottom:4px;}
.btn-show{background:var(--pb);color:var(--bg);border:none;padding:14px 32px;font-size:1.1rem;border-radius:8px;cursor:pointer;font-weight:bold;box-shadow:0 0 15px rgba(0,212,255,.5);}
.btn-show:hover{transform:scale(1.05);}
/* 解答エリア */
.ans-area{display:none;flex-direction:column;align-items:center;width:100%;animation:fadeIn .4s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ans-msg{display:flex;align-items:center;gap:12px;background:rgba(0,212,255,.08);padding:10px 20px;border-radius:20px;border:1px solid var(--pb);margin-bottom:20px;font-size:.95rem;}
.ans-msg svg{width:36px;height:36px;flex-shrink:0;}
.eval-row{display:flex;gap:12px;width:100%;justify-content:center;flex-wrap:wrap;}
.ev{flex:1;max-width:160px;padding:13px;border-radius:8px;border:none;cursor:pointer;font-weight:bold;font-size:.95rem;transition:all .2s;}
.ev:hover{transform:translateY(-2px);opacity:.9;}
.ev-hard  {background:#ff4d4d;color:#fff;}
.ev-mid   {background:#ffb84d;color:#fff;}
.ev-ok    {background:#4dff88;color:var(--bg);}
.ev-super {background:var(--pu);color:#fff;}
.ev-lbl   {font-size:.72rem;opacity:.85;display:block;margin-top:3px;}
/* 空状態 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:360px;padding:30px;}
.empty h2{color:var(--pb);margin-bottom:10px;}
.empty p{color:var(--td);margin-bottom:6px;}
.empty .tip{font-size:.85rem;background:var(--s2);border:1px solid var(--br);padding:12px 18px;border-radius:8px;margin-top:16px;max-width:480px;text-align:left;line-height:1.7;}
/* 進捗 */
.prog{margin-top:14px;color:var(--td);font-size:.9rem;}
/* リスト */
.list-wrap{width:100%;margin-top:20px;}
.list-wrap h3{color:var(--pb);font-size:.95rem;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--br);}
.list-item{background:var(--sf);border:1px solid var(--br);border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem;}
.list-item .li-sub{color:var(--td);font-size:.8rem;}
.li-star{cursor:pointer;font-size:1.1rem;flex-shrink:0;}
footer{text-align:center;padding:14px;color:var(--td);font-size:.84rem;border-top:1px solid var(--br);margin-top:20px;}
</style>
</head>
<body>
<header>
<svg viewBox="0 0 100 100" class="bl" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="55" r="35" fill="none" stroke="var(--pb)" stroke-width="3"/>
  <circle cx="22" cy="27" r="12" fill="none" stroke="var(--pb)" stroke-width="3"/>
  <circle cx="78" cy="27" r="12" fill="none" stroke="var(--pb)" stroke-width="3"/>
  <circle cx="37" cy="50" r="4" fill="var(--cy)"/>
  <circle cx="63" cy="50" r="4" fill="var(--cy)"/>
  <ellipse cx="50" cy="65" rx="6" ry="4" fill="var(--pb)"/>
  <path d="M44 70 Q50 75 56 70" fill="none" stroke="var(--pb)" stroke-width="2" stroke-linecap="round"/>
</svg>
<h1>BEAR RECALL（分散学習）</h1>
<a href="index.html" class="hlink">ホームへ戻る</a>
</header>

<div class="wrap">
<!-- 統計 -->
<div class="stats" id="statsBar"></div>

<!-- フラッシュカード -->
<div class="fc" id="FC"></div>

<div class="prog" id="prog">本日の残り: 0問</div>

<!-- 学習待ちリスト（SRS未設定の×・△） -->
<div class="list-wrap" id="pendList" style="display:none;">
  <h3>⚠ SRS登録待ち（×・△の未設定問題）— クリックで今日のキューに追加</h3>
  <div id="pendItems"></div>
</div>
</div>

<footer>Bear Sync - 第一種電気工事士 合格への道</footer>

<script>
/* ============================================================
   定数・SRS設定
============================================================ */
var LOG_KEY = 'denkoji1_training_log';

/* SRSインターバル（日数）: level 0→1→2→3→4→5→卒業 */
/* 難しい: level 0リセット, 普通: level維持, できた: level+1, 完璧: level+2 */
var SRS_DAYS = [1, 3, 7, 14, 30, 90]; /* 各レベルの次回日数 */

var MSGS = [
  '君ならできる！クマ！',
  '電気の流れを感じるクマ！',
  '間違えは成長の証だクマ！',
  '着実に進んでいるクマ！',
  'その調子だクマ！',
  '一歩ずつ確実にクマ！',
  '継続は力なりクマ！'
];

/* ============================================================
   LocalStorage
============================================================ */
function load(){
  try{ return JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); }
  catch(e){ return []; }
}
function store(d){ localStorage.setItem(LOG_KEY, JSON.stringify(d)); }

/* ============================================================
   日付ユーティリティ
============================================================ */
function today(){ return new Date().toISOString().split('T')[0]; }

function addDays(n){
  var d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

/* ============================================================
   SRS: 新規追加（×・△の問題を自動キューイング）
   nextReviewDate が null の ×・△ を翌日に設定する
============================================================ */
function autoQueueNgCards(){
  var data  = load();
  var dirty = false;
  data.forEach(function(log){
    /* × または △ で nextReviewDate が未設定のものを翌日にセット */
    if((log.result === '×' || log.result === '△') && !log.nextReviewDate){
      log.nextReviewDate = addDays(1); /* 翌日復習 */
      log.intervalLevel  = log.intervalLevel || 0;
      dirty = true;
    }
  });
  if(dirty) store(data);
}

/* ============================================================
   今日のSRSキューを取得
============================================================ */
function loadDueCards(){
  var data = load();
  var td   = today();
  return data.filter(function(log){
    if(!log.nextReviewDate) return false;
    return log.nextReviewDate <= td; /* 今日以前が期限の問題 */
  });
}

/* ============================================================
   統計バーを描画
============================================================ */
function drawStats(){
  var data    = load();
  var td      = today();
  var total   = data.length;
  var ng      = data.filter(function(l){ return l.result === '×'; }).length;
  var mgr     = data.filter(function(l){ return l.result === '△'; }).length;
  var due     = data.filter(function(l){ return l.nextReviewDate && l.nextReviewDate <= td; }).length;
  var grad    = data.filter(function(l){ return l.intervalLevel >= SRS_DAYS.length; }).length;

  var bar = document.getElementById('statsBar');
  bar.innerHTML =
    mkStat(total, '総記録数') +
    mkStat(ng,    '不正解 ×','red') +
    mkStat(mgr,   'まぐれ △','ylw') +
    mkStat(due,   '今日の復習','') +
    mkStat(grad,  '長期記憶済','grn');
}

function mkStat(n, lbl, cls){
  return '<div class="stat-box"><div class="stat-n'+(cls?' '+cls:'')+'" style="'+(cls==='red'?'color:#ff9999':cls==='ylw'?'color:#ffdd55':cls==='grn'?'color:#00ffaa':'')+'">'+n+'</div><div class="stat-l">'+lbl+'</div></div>';
}

/* ============================================================
   「SRS登録待ち」リストを描画
============================================================ */
function drawPendList(){
  var data = load();
  var pend = data.filter(function(l){
    return (l.result === '×' || l.result === '△') && !l.nextReviewDate;
  });
  var wrap  = document.getElementById('pendList');
  var items = document.getElementById('pendItems');
  if(pend.length === 0){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  items.innerHTML = '';
  pend.forEach(function(log){
    var div = document.createElement('div');
    div.className = 'list-item';
    var rc = log.result === '×' ? '#ff9999' : '#ffdd55';
    div.innerHTML =
      '<span style="color:'+rc+';font-weight:bold;font-size:1rem;">'+log.result+'</span>'
      +'<div style="flex:1;">'
        +'<div>'+log.subject.slice(0,20)+(log.subject.length>20?'…':'')+'</div>'
        +'<div class="li-sub">'+log.year+' '+log.period+' '+log.qNum+' / 記録日:'+log.recordDate+'</div>'
        +(log.memo?'<div class="li-sub" style="color:var(--cy);">メモ:'+log.memo.slice(0,30)+'</div>':'')
      +'</div>'
      +'<button class="btn-show" style="padding:6px 14px;font-size:.82rem;" data-id="'+log.id+'">今日追加</button>';
    items.appendChild(div);
    div.querySelector('button').addEventListener('click', function(){
      var id2  = this.dataset.id;
      var data2 = load();
      var idx  = data2.findIndex(function(l){ return l.id === id2; });
      if(idx !== -1){
        data2[idx].nextReviewDate = today(); /* 今日復習 */
        data2[idx].intervalLevel  = 0;
        store(data2);
        init(); /* 再初期化 */
      }
    });
  });
}

/* ============================================================
   カード描画
============================================================ */
var dueCards = [];
var cardIdx  = 0;

function renderCard(){
  var fc   = document.getElementById('FC');
  var prog = document.getElementById('prog');

  if(cardIdx >= dueCards.length){
    /* 完了 */
    fc.innerHTML =
      '<div class="empty">'
      +'<svg viewBox="0 0 100 100" style="width:90px;height:90px;margin-bottom:16px;">'
        +'<circle cx="50" cy="55" r="35" fill="none" stroke="var(--cy)" stroke-width="3"/>'
        +'<circle cx="22" cy="27" r="12" fill="none" stroke="var(--cy)" stroke-width="2"/>'
        +'<circle cx="78" cy="27" r="12" fill="none" stroke="var(--cy)" stroke-width="2"/>'
        +'<circle cx="37" cy="50" r="4" fill="var(--cy)"/>'
        +'<circle cx="63" cy="50" r="4" fill="var(--cy)"/>'
        +'<path d="M44 68 Q50 76 56 68" fill="none" stroke="var(--cy)" stroke-width="2.5" stroke-linecap="round"/>'
      +'</svg>'
      +'<h2>🐻 本日の復習完了！</h2>'
      +'<p>素晴らしい学習だクマ！ゆっくり休んで明日も頑張るクマ。</p>'
      +(dueCards.length > 0
        ? '<p style="color:var(--cy);margin-top:8px;">本日 '+dueCards.length+' 問 復習しました！</p>'
        : '<div class="tip">💡 <strong>使い方</strong><br>'
          +'① <a href="training_log.html" style="color:var(--pb);">学習記録</a> で過去問を記録する<br>'
          +'② 結果が <strong style="color:#ff9999;">×（不正解）</strong> や <strong style="color:#ffdd55;">△（まぐれ）</strong> の問題が自動的にSRSキューに登録されます<br>'
          +'③ 翌日から「今日の復習」として表示されます<br>'
          +'④ 「完璧！」を重ねると間隔が1日→3日→7日→14日→30日→90日と延び、長期記憶に定着します</div>'
      )
      +'</div>';
    prog.textContent = '本日の残り: 0問';
    return;
  }

  var card = dueCards[cardIdx];
  var rem  = dueCards.length - cardIdx;
  prog.textContent = '本日の残り: ' + rem + '問';

  /* インターバルレベル表示 */
  var lv    = card.intervalLevel || 0;
  var lvMax = SRS_DAYS.length;
  var dots  = '';
  for(var i = 0; i < lvMax; i++){
    dots += '<div class="lv-dot'+(i < lv ? ' on' : '')+'"></div>';
  }

  /* 結果バッジ */
  var resCls = card.result==='×' ? 'red' : card.result==='△' ? 'ylw' : 'grn';
  var resLbl = card.result==='×' ? '×不正解' : card.result==='△' ? '△まぐれ' : '○正解';

  /* メッセージ */
  var msg = MSGS[Math.floor(Math.random() * MSGS.length)];

  /* 次のインターバル表示 */
  var nextLvLabel = lv < lvMax ? SRS_DAYS[lv]+'日後' : '卒業！';

  var sn = card.subject.length > 20 ? card.subject.slice(0,20)+'…' : card.subject;

  fc.innerHTML =
    '<div class="fc-head">'
      +'<span class="badge">'+sn+'</span>'
      +'<span style="font-size:.85rem;color:var(--td);">'+card.year+' '+(card.period!=='-'?card.period:'')+' '+card.qNum+'</span>'
      +'<span class="badge '+resCls+'">前回:'+resLbl+'</span>'
      +'<div class="level-bar">LV '+dots+'</div>'
    +'</div>'
    +'<div class="fc-body">'
      +'<div class="q-info">この問題の内容を思い出してください</div>'
      +'<div class="q-sub">'+card.year+' '+(card.period!=='-'?card.period:'')+' '+card.qNum+'（'+card.subject+'）</div>'
      +(card.memo
        ? '<div class="q-memo"><div class="m-lbl">前回のメモ・ポイント</div>'+escH(card.memo)+'</div>'
        : '<div class="q-memo"><div class="m-lbl">メモ</div><span style="color:var(--td);">メモなし</span></div>'
      )
      +'<button class="btn-show" id="btnSh">頭で解いてから解答を表示</button>'
      +'<div class="ans-area" id="ansA">'
        +'<div class="ans-msg">'
          +'<svg viewBox="0 0 100 100">'
            +'<circle cx="50" cy="50" r="45" fill="none" stroke="var(--pb)" stroke-width="2"/>'
            +'<circle cx="35" cy="40" r="4" fill="var(--cy)"/>'
            +'<circle cx="65" cy="40" r="4" fill="var(--cy)"/>'
            +'<path d="M40 65 Q50 75 60 65" fill="none" stroke="var(--pb)" stroke-width="2"/>'
          +'</svg>'
          +'<span>'+msg+'</span>'
        +'</div>'
        +'<div style="font-size:.9rem;color:var(--td);margin-bottom:16px;">実際の過去問テキストや解説と照らし合わせて自己評価してください</div>'
        +'<div class="eval-row">'
          +'<button class="ev ev-hard"  data-ev="hard"  data-id="'+card.id+'">難しい<span class="ev-lbl">明日 (1日後)</span></button>'
          +'<button class="ev ev-mid"   data-ev="mid"   data-id="'+card.id+'">普通<span class="ev-lbl">'+nextLvLabel+'</span></button>'
          +'<button class="ev ev-ok"    data-ev="ok"    data-id="'+card.id+'">できた！<span class="ev-lbl">次のLVへ</span></button>'
          +'<button class="ev ev-super" data-ev="super" data-id="'+card.id+'">完璧！<span class="ev-lbl">2段飛ばし</span></button>'
        +'</div>'
      +'</div>'
    +'</div>';

  /* 解答表示ボタン */
  document.getElementById('btnSh').addEventListener('click', function(){
    this.style.display = 'none';
    document.getElementById('ansA').style.display = 'flex';
  });

  /* 評価ボタン */
  fc.querySelectorAll('.ev').forEach(function(btn){
    btn.addEventListener('click', function(){
      evaluate(this.dataset.id, this.dataset.ev);
    });
  });
}

function escH(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   評価処理（SRS更新）
============================================================ */
function evaluate(id, ev){
  var data = load();
  var idx  = data.findIndex(function(l){ return l.id === id; });
  if(idx === -1){ cardIdx++; renderCard(); return; }

  var log = data[idx];
  var lv  = log.intervalLevel || 0;

  if(ev === 'hard'){
    /* 難しい: レベルリセット→翌日 */
    log.intervalLevel  = 0;
    log.nextReviewDate = addDays(1);
    log.result         = '×'; /* 再記録 */
  } else if(ev === 'mid'){
    /* 普通: レベル維持 */
    var days = SRS_DAYS[Math.max(0, lv)];
    log.nextReviewDate = addDays(days);
  } else if(ev === 'ok'){
    /* できた: レベル+1 */
    lv++;
    log.intervalLevel = lv;
    if(lv >= SRS_DAYS.length){
      log.nextReviewDate = null; /* 卒業（長期記憶定着！） */
      log.result = '○';
    } else {
      log.nextReviewDate = addDays(SRS_DAYS[lv]);
    }
  } else if(ev === 'super'){
    /* 完璧: レベル+2 */
    lv = Math.min(lv + 2, SRS_DAYS.length);
    log.intervalLevel = lv;
    if(lv >= SRS_DAYS.length){
      log.nextReviewDate = null; /* 卒業 */
      log.result = '○';
    } else {
      log.nextReviewDate = addDays(SRS_DAYS[lv]);
    }
  }

  store(data);
  cardIdx++;
  renderCard();
  drawStats();
}

/* ============================================================
   初期化
============================================================ */
function init(){
  autoQueueNgCards(); /* ×・△ を自動SRS登録 */
  dueCards = loadDueCards();
  cardIdx  = 0;
  drawStats();
  renderCard();
  drawPendList();
}

init();
</script>
</body>
</html>
